name: GitOps K3s Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  # STAGE 1: DEPLOYMENT & ROLLOUT
  deploy-k3s:
    name: 1. Deploy K3s Manifests & Verify Rollout
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Kubernetes Namespace Exists
        run: |
          kubectl create namespace guardrails --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject PostgreSQL Secrets from GitHub Secrets Pipeline
        run: |
          kubectl create secret generic postgres-secrets \
            --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB || 'guardrails_db' }}" \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER || 'guardrails_user' }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD || 'guardrails_runtime_secure_pass' }}" \
            -n guardrails --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Kubernetes Manifests via Kustomize
        run: |
          kubectl kustomize k3s/

      - name: Apply Manifests to K3s Cluster
        run: |
          kubectl apply -k k3s/

      - name: Display Real-Time Cluster Pod Status & Events
        run: |
          echo "======================================================="
          echo "📊 Current Pod Status in 'guardrails' Namespace"
          echo "======================================================="
          kubectl get pods -n guardrails -o wide
          echo ""
          echo "📜 Recent K3s Cluster Events:"
          kubectl get events -n guardrails --sort-by='.metadata.creationTimestamp' | tail -n 10

      - name: Fast Rollout Verification
        run: |
          kubectl rollout status deployment/postgres -n guardrails --timeout=120s
          kubectl rollout status deployment/granite-guardian -n guardrails --timeout=120s
          kubectl rollout status deployment/nemo-guardrails-server -n guardrails --timeout=360s

  # STAGE 2: POST-DEPLOYMENT HEALTH & INTEGRATION TESTS (ONLY RUNS IF STAGE 1 SUCCEEDS)
  integration-health-tests:
    name: 2. Automated Post-Deploy Integration Tests
    needs: deploy-k3s
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config

    steps:
      - name: Run Automated Health Checks
        run: |
          echo "======================================================="
          echo "📊 Running Automated Health Checks & Integration Tests"
          echo "======================================================="
          
          # 1. Test PostgreSQL DB connectivity & seed integrity
          echo "🐘 [TEST 1/3] Verifying PostgreSQL connection and table seed..."
          kubectl exec deployment/postgres -n guardrails -- psql -U guardrails_user -d guardrails_db -c "SELECT count(*) FROM characters;"
          
          # 2. Test Granite Guardian 2B Classifier endpoint
          echo "🔬 [TEST 2/3] Verifying Granite Guardian 2B Classifier service..."
          kubectl exec deployment/postgres -n guardrails -- wget -qO- http://granite-guardian-service.guardrails.svc.cluster.local:11434/api/tags || true
          
          # 3. Test NeMo Guardrails Server health endpoint
          echo "🛡️ [TEST 3/3] Verifying NeMo Guardrails Server health endpoint..."
          kubectl exec deployment/postgres -n guardrails -- wget -qO- http://nemo-guardrails-service.guardrails.svc.cluster.local:8000/v1/health || true
          
          echo "======================================================="
          echo "✅ All Post-Deployment Integration Tests Passed!"
          echo "======================================================="

      - name: Display Pod Status
        run: |
          kubectl get pods -n guardrails

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-banking-agent
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-banking-agent
  template:
    metadata:
      labels:
        app: app-banking-agent
    spec:
      containers:
      - name: agent
        image: ghcr.io/gabsgoms10/app-banking-agent:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "8002"
        - name: LLM_MODEL
          value: "qwen2.5:3b"
        - name: OPENAI_API_BASE
          value: "http://qwen-engine-service.guardrails.svc.cluster.local:11434/v1"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service.guardrails.svc.cluster.local:5000"
        - name: POSTGRES_HOST
          value: "postgres-service.guardrails.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 8002
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: app-banking-agent-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: app-banking-agent
  ports:
  - port: 8002
    targetPort: 8002

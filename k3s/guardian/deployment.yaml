apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-guardian
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: granite-guardian
  template:
    metadata:
      labels:
        app: granite-guardian
    spec:
      containers:
      - name: guardian-classifier
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            echo "Waiting for Ollama daemon to initialize..."
            until ollama list > /dev/null 2>&1; do sleep 1; done
            echo "Pulling IBM Granite Guardian 2B model weights..."
            ollama pull granite3-guardian:2b || true
            ollama cp granite3-guardian:2b self_check_input || true
            ollama cp granite3-guardian:2b self_check_output || true
            wait
        env:
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 3200Mi
            cpu: 2000m
          requests:
            memory: 1200Mi
            cpu: 500m
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ollama list | grep -q 'granite3-guardian:2b'"
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: granite-guardian-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: granite-guardian
  ports:
  - port: 11434
    targetPort: 11434

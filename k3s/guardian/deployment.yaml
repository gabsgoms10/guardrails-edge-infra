apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-guardian
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: granite-guardian
  template:
    metadata:
      labels:
        app: granite-guardian
    spec:
      containers:
      - name: guardian-classifier
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            echo "Waiting for Ollama daemon to initialize..."
            until wget -qO- http://localhost:11434/api/tags > /dev/null 2>&1; do sleep 1; done
            echo "Pulling IBM Granite Guardian 2B model weights..."
            ollama pull granite3-guardian:2b || true
            echo "Pulling Qwen 2.5 3B reasoning & tool-calling model weights..."
            ollama pull qwen2.5:3b || true
            wait
        env:
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 3200Mi
            cpu: 2000m
          requests:
            memory: 1200Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: granite-guardian-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: granite-guardian
  ports:
  - port: 11434
    targetPort: 11434

apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-guardian
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: granite-guardian
  template:
    metadata:
      labels:
        app: granite-guardian
    spec:
      containers:
      - name: guardian-classifier
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 1800Mi
            cpu: 1500m
          requests:
            memory: 800Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: granite-guardian-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: granite-guardian
  ports:
  - port: 11434
    targetPort: 11434

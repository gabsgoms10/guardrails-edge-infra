apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-engine
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-engine
  template:
    metadata:
      labels:
        app: qwen-engine
    spec:
      containers:
      - name: qwen-reasoning-engine
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            echo "Waiting for Ollama daemon to initialize..."
            until ollama list > /dev/null 2>&1; do sleep 1; done
            echo "Pulling Qwen 2.5 3B reasoning & tool-calling model weights..."
            ollama pull qwen2.5:3b || true
            wait
        env:
        - name: OLLAMA_MODELS
          value: /root/.ollama/models
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 3500Mi
            cpu: 2000m
          requests:
            memory: 1500Mi
            cpu: 500m
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ollama list | grep -q 'qwen2.5:3b'"
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-engine-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: qwen-engine
  ports:
  - port: 11434
    targetPort: 11434

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir mlflow psycopg2-binary
          MLFLOW_DB_URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-service.guardrails.svc.cluster.local:5432/mlflow_db"
          echo "Running MLflow DB Schema Upgrade..."
          mlflow db upgrade "${MLFLOW_DB_URI}" || true
          echo "Starting MLflow Tracking & Tracing Server..."
          mlflow server \
            --backend-store-uri "${MLFLOW_DB_URI}" \
            --default-artifact-root /tmp/mlruns \
            --host 0.0.0.0 \
            --port 5000
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5000
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-nodeport
  namespace: guardrails
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500

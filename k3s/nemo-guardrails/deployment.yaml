apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails-server
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nemo-guardrails
  template:
    metadata:
      labels:
        app: nemo-guardrails
    spec:
      containers:
      - name: nemo-server
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir nemoguardrails uvicorn fastapi && \
            nemoguardrails server --config /app/config --port 8000 --host 0.0.0.0
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: 1200Mi
            cpu: 1000m
          requests:
            memory: 500Mi
            cpu: 300m
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 25
          periodSeconds: 5
        volumeMounts:
        - name: policy-volume
          mountPath: /app/config
      volumes:
      - name: policy-volume
        configMap:
          name: nemo-policy-config
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-guardrails-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: nemo-guardrails
  ports:
  - port: 8000
    targetPort: 8000

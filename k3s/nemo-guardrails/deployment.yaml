apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails-server
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nemo-guardrails
  template:
    metadata:
      labels:
        app: nemo-guardrails
    spec:
      containers:
      - name: nemo-server
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install "nemoguardrails[server]" langchain langchain-google-genai langchain-openai langchain-community uvicorn fastapi && \
            nemoguardrails server --config /app/config --default-config-id config --port 8000
        ports:
        - containerPort: 8000
        env:
        - name: NEMOGUARDRAILS_LLM_FRAMEWORK
          value: "langchain"
        - name: MAIN_MODEL_ENGINE
          value: "google_genai"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: GEMINI_API_KEY
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: GEMINI_API_KEY
              optional: true
        resources:
          limits:
            memory: 1200Mi
            cpu: 1000m
          requests:
            memory: 500Mi
            cpu: 300m
        readinessProbe:
          httpGet:
            path: /v1/rails/configs
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: policy-volume
          mountPath: /app/config/config
      volumes:
      - name: policy-volume
        configMap:
          name: nemo-policy-config
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-guardrails-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: nemo-guardrails
  ports:
  - port: 8000
    targetPort: 8000

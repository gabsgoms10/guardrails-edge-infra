apiVersion: apps/v1
kind: Deployment
metadata:
  name: arize-phoenix
  namespace: guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arize-phoenix
  template:
    metadata:
      labels:
        app: arize-phoenix
    spec:
      containers:
      - name: phoenix
        image: arizephoenix/phoenix:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6006
          name: http
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        readinessProbe:
          httpGet:
            path: /
            port: 6006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: arize-phoenix-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: arize-phoenix
  ports:
  - name: http
    port: 6006
    targetPort: 6006
  - name: otlp-http
    port: 4318
    targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: arize-phoenix-nodeport
  namespace: guardrails
spec:
  type: NodePort
  selector:
    app: arize-phoenix
  ports:
  - name: http
    port: 6006
    targetPort: 6006
    nodePort: 30600

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-banking-tools
  namespace: guardrails
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mcp-banking-tools
  template:
    metadata:
      labels:
        app: mcp-banking-tools
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service.guardrails.svc.cluster.local 5432; do echo "Waiting for PostgreSQL database to be ready..."; sleep 2; done;']
      containers:
      - name: mcp-server
        image: ghcr.io/gabsgoms10/mcp-banking-tools:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        readinessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8001"
        - name: POSTGRES_HOST
          value: "postgres-service.guardrails.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        resources:
          limits:
            memory: 300Mi
            cpu: 300m
          requests:
            memory: 100Mi
            cpu: 50m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-banking-service
  namespace: guardrails
spec:
  type: ClusterIP
  selector:
    app: mcp-banking-tools
  ports:
  - port: 8001
    targetPort: 8001

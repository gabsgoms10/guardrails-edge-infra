apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-seed
  namespace: guardrails
data:
  init.sql: |
    -- Table: characters (Bank Accounts Ledger)
    CREATE TABLE IF NOT EXISTS characters (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name TEXT NOT NULL,
      pix_key TEXT UNIQUE NOT NULL,
      balance_cents BIGINT NOT NULL DEFAULT 0,
      avatar_seed TEXT,
      risk_profile TEXT DEFAULT 'conservative',
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Table: blocked_pix_keys (BACEN Fraud Registry)
    CREATE TABLE IF NOT EXISTS blocked_pix_keys (
      pix_key TEXT PRIMARY KEY,
      reason TEXT NOT NULL,
      added_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Table: transactions (Ledger Audit Log)
    CREATE TABLE IF NOT EXISTS transactions (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      origin_character_id UUID REFERENCES characters(id),
      destination_key TEXT NOT NULL,
      amount_cents BIGINT NOT NULL,
      status TEXT NOT NULL CHECK (status IN ('approved', 'blocked', 'pending_confirmation')),
      decisive_rail TEXT,
      reason TEXT,
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Extension: vector (pgvector for Agentic RAG)
    CREATE EXTENSION IF NOT EXISTS vector;

    -- Table: bacen_regulations (BACEN Financial Policy Vector & RAG Registry)
    CREATE TABLE IF NOT EXISTS bacen_regulations (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      resolution_code TEXT NOT NULL,
      title TEXT NOT NULL,
      category TEXT NOT NULL,
      content TEXT NOT NULL,
      keywords TEXT[],
      created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Idempotent Seed Data (English International Format)
    INSERT INTO characters (id, name, pix_key, balance_cents, risk_profile, avatar_seed)
    VALUES 
      ('11111111-1111-1111-1111-111111111111', 'Leo Vance', 'leo.vance@email.com', 250000, 'conservative', '👨‍💼'),
      ('22222222-2222-2222-2222-222222222222', 'Maria Silva', 'maria.silva@email.com', 4500000, 'high_net_worth', '👩‍💼'),
      ('33333333-3333-3333-3333-333333333333', 'Enterprise X Corp', 'contact@enterprisex.corp', 12000000, 'corporate', '🏬')
    ON CONFLICT (pix_key) DO NOTHING;

    INSERT INTO blocked_pix_keys (pix_key, reason)
    VALUES 
      ('fraudster@pix.com', 'PIX key flagged for malicious fraud in BACEN registry'),
      ('night.fraud@pix.com', 'Multiple night-time phishing attacks reported'),
      ('12345678900', 'CPF blocked by Central Bank judicial enforcement order')
    ON CONFLICT (pix_key) DO NOTHING;

    INSERT INTO bacen_regulations (resolution_code, title, category, content, keywords)
    VALUES
      ('BCB-142', 'Limites de Transação Noturna PIX', 'pix_limits', 'De acordo com a Resolução BCB nº 142, estabelece-se o limite padrão de R$ 1.000,00 (100.000 centavos) para transações PIX realizadas por pessoas físicas no horário noturno compreendido entre 20:00 e 06:00. Clientes podem solicitar alteração do limite com prazo de aprovação de 24h a 48h.', ARRAY['noturno', 'limite', 'pix', '20h', '1000']),
      ('BCB-103', 'Mecanismo Especial de Devolução (MED)', 'fraud_med', 'A Resolução BCB nº 103 disciplina o Mecanismo Especial de Devolução (MED). Em casos de fundada suspeita de fraude, golpe ou engenharia social, a instituição financeira receptora deve efetuar o bloqueio cautelar imediato dos valores na conta do destinatário por até 72 horas para análise de estorno.', ARRAY['med', 'devolucao', 'fraude', 'bloqueio', 'estorno']),
      ('BCB-001', 'Diretrizes de Autenticação e Chaves PIX', 'dict_policy', 'A Resolução BCB nº 1 define as regras de chave PIX e autenticação no DICT. Todas as transferências exigem validação prévia de chave ativa (CPF, CNPJ, e-mail, telefone ou chave aleatória). É proibida a conclusão de transferências para chaves sinalizadas como bloqueadas por ordem judicial ou administrativa.', ARRAY['chave', 'dict', 'autenticacao', 'cpf', 'cnpj'])
    ON CONFLICT DO NOTHING;

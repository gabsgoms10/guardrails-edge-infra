# TEMPLATE FILE: Do NOT commit real credentials to public git repositories!
# Register these secrets in GitHub Repo Settings -> Secrets and variables -> Actions
# Secrets: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: guardrails
type: Opaque
stringData:
  POSTGRES_DB: YOUR_POSTGRES_DB_HERE
  POSTGRES_USER: YOUR_POSTGRES_USER_HERE
  POSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD_HERE
